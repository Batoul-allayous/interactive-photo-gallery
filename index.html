
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessible Interactive Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #222;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        #image {
            width: 90%;
            max-width: 800px;
            height: 350px;
            margin: 20px auto;
            border: 3px solid #333;
            border-radius: 10px;
            background-color: white;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        figure {
            margin: 0;
            padding: 8px;
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
        }

        figure img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            border-radius: 5px;
        }

        figure figcaption {
            padding: 10px 0 4px;
            font-size: 15px;
        }

        figure:hover,
        figure:focus {
            border-color: #c2185b;
            outline: 3px solid #c2185b;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 15px;
            }

            #image {
                height: 250px;
                font-size: 18px;
            }

            figure img {
                height: 120px;
            }
        }
    </style>
</head>

<body>

    <h1>Accessible Interactive Photo Gallery</h1>

    <p>
        Hover over an image or use the Tab key to explore the gallery.
    </p>

    <!-- Large display area -->
    <div
        id="image"
        role="status"
        aria-live="polite"
        aria-atomic="true"
    >
        Hover over or focus on an image below to display it here.
    </div>

    <!-- Six accessible images -->
    <div class="gallery">

        <figure>
            <img
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80"
                alt="A peaceful mountain lake surrounded by green hills"
            >
            <figcaption>Mountain Lake</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
                alt="A wooden cabin beside a lake with mountains in the distance"
            >
            <figcaption>Lake Cabin</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80"
                alt="A scenic landscape with a winding path through nature"
            >
            <figcaption>Nature Path</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=600&q=80"
                alt="Golden sunlight shining over a field at sunrise"
            >
            <figcaption>Golden Sunrise</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80"
                alt="Sunlight filtering through a dense green forest"
            >
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=600&q=80"
                alt="Ocean waves rolling toward the shore"
            >
            <figcaption>Ocean Waves</figcaption>
        </figure>

    </div>

    <script>
        // Display an image when the mouse enters a figure
        function upDate(previewPic) {
            console.log("Mouse entered:", previewPic.alt);

            const display = document.getElementById("image");

            display.textContent = previewPic.alt;
            display.style.backgroundImage =
                "url('" + previewPic.src + "')";
        }

        // Restore the original display when the mouse leaves
        function undo() {
            console.log("Mouse left the image");

            const display = document.getElementById("image");

            display.textContent =
                "Hover over or focus on an image below to display it here.";

            display.style.backgroundImage = "url('')";
        }

        // Display an image when its figure receives keyboard focus
        function handleFocus(event) {
            const img = event.currentTarget.querySelector("img");

            if (img) {
                upDate(img);
            }
        }

        // Restore the display when the figure loses keyboard focus
        function handleBlur() {
            undo();
        }

        // Add all event listeners and tabindex attributes after page load
        function addTabFocus() {
            console.log("Page loaded: setting up the photo gallery");

            const figures = document.querySelectorAll(".gallery figure");

            for (let i = 0; i < figures.length; i++) {
                // Add keyboard accessibility using JavaScript
                figures[i].setAttribute("tabindex", "0");

                // Mouse events
                figures[i].addEventListener("mouseover", handleFocus);
                figures[i].addEventListener("mouseleave", undo);

                // Keyboard events
                figures[i].addEventListener("focus", handleFocus);
                figures[i].addEventListener("blur", handleBlur);
            }

            console.log("Tabindex added to", figures.length, "figures");
        }

        // Run the setup when the page finishes loading
        window.addEventListener("load", addTabFocus);
    </script>

</body>
</html>
